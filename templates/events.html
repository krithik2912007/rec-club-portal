{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Events</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <link rel="stylesheet" href="{% static 'css/mobile.css' %}">
    <style>
        /* (viii) Sort pills */
        .sort-row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:8px; }
        .sort-label { font-weight:600; font-size:.88rem; color:#555; white-space:nowrap; }
        .sort-pill { padding:5px 16px; border-radius:20px; border:1.5px solid #ccc; background:#fff; cursor:pointer; font-size:.83rem; transition:all .2s; }
        .sort-pill.active { background:var(--primary,#4f46e5); color:#fff; border-color:var(--primary,#4f46e5); }
        .results-count { font-size:.85rem; color:#6b7280; margin:8px 0 4px; font-weight:500; }
    
        /* Notification Bell */
        .notif-wrap { position:relative; display:inline-flex; align-items:center; }
        .notif-bell { background:none; border:none; cursor:pointer; font-size:1.2rem; padding:6px; border-radius:50%; transition:background .2s; position:relative; }
        .notif-bell:hover { background:rgba(99,102,241,.1); }
        .notif-badge { position:absolute; top:2px; right:2px; background:#ef4444; color:#fff; border-radius:50%; width:16px; height:16px; font-size:.6rem; font-weight:700; display:none; align-items:center; justify-content:center; }
        .notif-badge.show { display:flex; }
        .notif-dropdown { position:absolute; right:0; top:calc(100% + 8px); width:320px; background:#fff; border:1px solid #e5e7eb; border-radius:12px; box-shadow:0 8px 24px rgba(0,0,0,.12); z-index:999; display:none; max-height:380px; overflow-y:auto; }
        .notif-dropdown.open { display:block; }
        .notif-header { padding:12px 16px; border-bottom:1px solid #f3f4f6; display:flex; justify-content:space-between; align-items:center; }
        .notif-header span { font-weight:700; font-size:.9rem; color:#1e1b4b; }
        .notif-header button { background:none; border:none; color:#6366f1; font-size:.75rem; cursor:pointer; font-weight:600; }
        .notif-item { padding:10px 16px; border-bottom:1px solid #f9fafb; font-size:.82rem; color:#374151; cursor:pointer; transition:background .15s; }
        .notif-item:hover { background:#f9fafb; }
        .notif-item.unread { background:#eff6ff; font-weight:600; }
        .notif-item .notif-time { font-size:.72rem; color:#9ca3af; margin-top:2px; }
        .notif-empty { padding:24px 16px; text-align:center; color:#9ca3af; font-size:.85rem; }

    </style>
</head>
<body>

<div id="page-loader"></div>

<header>
    <div class="logo-title">
        <img src="{% static 'images/r-logo.png' %}" class="site-logo">
        <h3>Centralized Club Portal</h3>
    </div>
    <nav>
        <a href="/home">Home</a>
        <a href="/clubs">Clubs</a>
        <a href="/events" class="active">Events</a>
        <a href="/calendar">Calendar</a>
                <div class="notif-wrap" id="notifWrap">
            <button class="notif-bell" onclick="toggleNotifDropdown(event)" title="Notifications">
                🔔
                <span class="notif-badge" id="notifBadge"></span>
            </button>
            <div class="notif-dropdown" id="notifDropdown">
                <div class="notif-header">
                    <span>Notifications</span>
                    <button onclick="markAllNotifsRead()">Mark all read</button>
                </div>
                <div id="notifList"><div class="notif-empty">No notifications</div></div>
            </div>
        </div>
        <div class="profile-btn-wrap" id="profileBtnWrap"></div>
    </nav>
</header>

<section class="events-container">
    <h1>Upcoming Events</h1>
    <p class="subtitle">Discover events across all clubs</p>

    <!-- Search -->
    <input type="text" class="search-bar" id="eventSearch" placeholder="Search events..." onkeyup="searchEvents()">

    <!-- Type filters -->
    <div class="event-filters" id="filters">
        <button class="filter active" onclick="filterEvents('all', this)">All</button>
        <button class="filter" onclick="filterEvents('workshop', this)">Workshop</button>
        <button class="filter" onclick="filterEvents('competition', this)">Competition</button>
        <button class="filter" onclick="filterEvents('seminar', this)">Seminar</button>
        <button class="filter" onclick="filterEvents('social', this)">Social</button>
        <button class="filter" onclick="filterEvents('recruitment', this)">Recruitment</button>
    </div>

    <!-- (viii) Sort by popular / favourited -->
    <div class="sort-row">
        <span class="sort-label">Sort by:</span>
        <button class="sort-pill active" onclick="setSortMode('default', this)">Default</button>
        <button class="sort-pill" onclick="setSortMode('popular', this)">🔥 Most Popular</button>
        <button class="sort-pill" onclick="setSortMode('favourited', this)">❤️ Most Favourited</button>
    </div>

    <p id="eventCount" class="results-count"></p>
    <div class="event-grid" id="eventGrid"></div>
</section>

<footer><p>Centralized Club Portal</p></footer>

<script src="{% static 'js/script.js' %}"></script>
<script src="{% static 'js/mobile_nav.js' %}"></script>

<script>
let currentSortMode = "default";

document.addEventListener("DOMContentLoaded", () => {
    initProfileDropdown();
    loadEvents();
});

// (viii) Sort mode switcher — respects active type filter and search
function setSortMode(mode, el){
    currentSortMode = mode;
    document.querySelectorAll(".sort-pill").forEach(p => p.classList.remove("active"));
    el.classList.add("active");

    if(mode === "popular"){
        apiFetch("/api/events/popular")
        .then(r => r.json())
        .then(events => {
            allEvents = events;
            applyEventFilters(); // apply active type filter + search on top of sorted data
        });
    } else if(mode === "favourited"){
        apiFetch("/api/events/favourited")
        .then(r => r.json())
        .then(events => {
            allEvents = events;
            applyEventFilters();
        });
    } else {
        // Default — reload all events then apply filters
        apiFetch("/api/events").then(r => r.json()).then(events => {
            allEvents = events;
            applyEventFilters();
        });
    }
}
</script>


<script>
// ── Notification Bell ──
function loadNotifications() {
    apiFetch("/api/notifications").then(r => {
        if (!r.ok) return null;
        return r.json();
    }).then(data => {
        if (!data) return;
        const badge = document.getElementById("notifBadge");
        const list  = document.getElementById("notifList");
        if (!badge || !list) return;
        const unread = data.filter(n => !n.is_read);
        if (unread.length > 0) {
            badge.textContent = unread.length > 9 ? "9+" : unread.length;
            badge.classList.add("show");
        } else {
            badge.classList.remove("show");
        }
        if (data.length === 0) {
            list.innerHTML = '<div class="notif-empty">No notifications yet</div>';
            return;
        }
        list.innerHTML = data.map(n =>
            '<div class="notif-item ' + (n.is_read ? "" : "unread") + '" onclick="markNotifRead(' + n.id + ', this)">' +
            '<div>' + n.message + '</div>' +
            '<div class="notif-time">' + new Date(n.created_at).toLocaleString() + '</div>' +
            '</div>'
        ).join("");
    }).catch(() => {});
}

function toggleNotifDropdown(e) {
    e.stopPropagation();
    document.getElementById("notifDropdown").classList.toggle("open");
    loadNotifications();
}

function markNotifRead(id, el) {
    apiFetch("/api/notifications/" + id + "/read", { method: "PUT" }).then(() => {
        el.classList.remove("unread");
        loadNotifications();
    }).catch(() => {});
}

function markAllNotifsRead() {
    apiFetch("/api/notifications/read-all", { method: "PUT" }).then(() => {
        loadNotifications();
        document.getElementById("notifDropdown").classList.remove("open");
    }).catch(() => {});
}

document.addEventListener("click", function(e) {
    var wrap = document.getElementById("notifWrap");
    if (wrap && !wrap.contains(e.target)) {
        document.getElementById("notifDropdown").classList.remove("open");
    }
});

// Load notifications on page load and refresh every 60s
document.addEventListener("DOMContentLoaded", function() {
    loadNotifications();
    setInterval(loadNotifications, 60000);
});
</script>

</body>
</html>
