{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Events</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <style>
        /* (viii) Sort pills */
        .sort-row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:8px; }
        .sort-label { font-weight:600; font-size:.88rem; color:#555; white-space:nowrap; }
        .sort-pill { padding:5px 16px; border-radius:20px; border:1.5px solid #ccc; background:#fff; cursor:pointer; font-size:.83rem; transition:all .2s; }
        .sort-pill.active { background:var(--primary,#4f46e5); color:#fff; border-color:var(--primary,#4f46e5); }
    </style>
</head>
<body>

<div id="page-loader"></div>

<header>
    <div class="logo-title">
        <img src="{% static 'images/r-logo.png' %}" class="site-logo">
        <h3>Centralized Club Portal</h3>
    </div>
    <nav>
        <a href="/home">Home</a>
        <a href="/clubs">Clubs</a>
        <a href="/events" class="active">Events</a>
        <a href="/calendar">Calendar</a>
        <div class="profile-btn-wrap" id="profileBtnWrap"></div>
    </nav>
</header>

<section class="events-container">
    <h1>Upcoming Events</h1>
    <p class="subtitle">Discover events across all clubs</p>

    <!-- Search -->
    <input type="text" class="search-bar" id="eventSearch" placeholder="Search events..." onkeyup="searchEvents()">

    <!-- Type filters -->
    <div class="event-filters" id="filters">
        <button class="filter active" onclick="filterEvents('all', this)">All</button>
        <button class="filter" onclick="filterEvents('workshop', this)">Workshop</button>
        <button class="filter" onclick="filterEvents('competition', this)">Competition</button>
        <button class="filter" onclick="filterEvents('seminar', this)">Seminar</button>
        <button class="filter" onclick="filterEvents('social', this)">Social</button>
        <button class="filter" onclick="filterEvents('recruitment', this)">Recruitment</button>
    </div>

    <!-- (viii) Sort by popular / favourited -->
    <div class="sort-row">
        <span class="sort-label">Sort by:</span>
        <button class="sort-pill active" onclick="setSortMode('default', this)">Default</button>
        <button class="sort-pill" onclick="setSortMode('popular', this)">🔥 Most Popular</button>
        <button class="sort-pill" onclick="setSortMode('favourited', this)">❤️ Most Favourited</button>
    </div>

    <p id="eventCount" class="count-text"></p>
    <div class="event-grid" id="eventGrid"></div>
</section>

<footer><p>Centralized Club Portal</p></footer>

<script src="{% static 'js/script.js' %}"></script>

<script>
let currentSortMode = "default";

document.addEventListener("DOMContentLoaded", () => {
    initProfileDropdown();
    loadEvents();
});

// (viii) Sort mode switcher
function setSortMode(mode, el){
    currentSortMode = mode;
    document.querySelectorAll(".sort-pill").forEach(p => p.classList.remove("active"));
    el.classList.add("active");

    if(mode === "popular"){
        apiFetch("/api/events/popular")
        .then(r => r.json())
        .then(events => {
            allEvents = events;
            renderEvents("eventGrid", allEvents);
            document.getElementById("eventCount").textContent = events.length + " events";
        });
    } else if(mode === "favourited"){
        apiFetch("/api/events/favourited")
        .then(r => r.json())
        .then(events => {
            allEvents = events;
            renderEvents("eventGrid", allEvents);
            document.getElementById("eventCount").textContent = events.length + " events";
        });
    } else {
        loadEvents();
    }
}
</script>

</body>
</html>
