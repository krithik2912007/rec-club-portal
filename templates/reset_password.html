{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Reset Password — Club Portal</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1e1b4b, #4f46e5);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: #fff;
            border-radius: 20px;
            padding: 40px 36px;
            width: 380px;
            max-width: 92vw;
            box-shadow: 0 20px 60px rgba(0,0,0,.25);
            text-align: center;
        }
        .icon { font-size: 2.5rem; margin-bottom: 12px; }
        h2 { color: #1e1b4b; font-size: 1.4rem; margin-bottom: 6px; }
        p  { color: #6b7280; font-size: .85rem; margin-bottom: 24px; }
        .field {
            width: 100%;
            padding: 13px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: .95rem;
            outline: none;
            margin-bottom: 14px;
            transition: border .2s;
        }
        .field:focus { border-color: #4f46e5; }
        .btn {
            width: 100%;
            padding: 14px;
            background: #4f46e5;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background .2s;
        }
        .btn:hover { background: #3730a3; }
        .btn:disabled { background: #a5b4fc; cursor: not-allowed; }
        #msg { margin-top: 14px; font-size: .85rem; min-height: 20px; }
        .success { color: #10b981; }
        .error   { color: #ef4444; }
        .note { font-size: .75rem; color: #9ca3af; margin-top: 8px; }
    </style>
</head>
<body>
<div class="card">
    <div class="icon">🔐</div>
    <h2>Reset Your Password</h2>
    <p>Enter your new password below.</p>

    <input class="field" type="password" id="newPass"    placeholder="New password" />
    <input class="field" type="password" id="confirmPass" placeholder="Confirm new password" />
    <p class="note">Min 6 chars · 1 uppercase · 1 lowercase · 1 special character</p>

    <button class="btn" id="resetBtn" onclick="submitReset()">Reset Password →</button>
    <div id="msg"></div>
</div>

<script>
var token = "{{ token }}";

function submitReset() {
    var pass    = document.getElementById("newPass").value;
    var confirm = document.getElementById("confirmPass").value;
    var msg     = document.getElementById("msg");
    var btn     = document.getElementById("resetBtn");

    msg.textContent = "";

    if (!pass || !confirm) {
        msg.className = "error";
        msg.textContent = "Please fill in both fields.";
        return;
    }

    var regex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*[\W_]).{6,}$/;
    if (!regex.test(pass)) {
        msg.className = "error";
        msg.textContent = "Password must have uppercase, lowercase, special char and be 6+ chars.";
        return;
    }

    if (pass !== confirm) {
        msg.className = "error";
        msg.textContent = "Passwords do not match.";
        return;
    }

    btn.textContent = "Updating...";
    btn.disabled = true;

    fetch("/reset-password/" + token, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password: pass })
    })
    .then(r => r.json())
    .then(data => {
        btn.textContent = "Reset Password →";
        btn.disabled = false;
        if (data.message === "Password updated successfully") {
            msg.className = "success";
            msg.textContent = "✅ Password updated! Redirecting to login...";
            setTimeout(() => { window.location.href = "/"; }, 2000);
        } else {
            msg.className = "error";
            msg.textContent = data.message || "Something went wrong.";
        }
    })
    .catch(() => {
        btn.textContent = "Reset Password →";
        btn.disabled = false;
        msg.className = "error";
        msg.textContent = "Network error. Please try again.";
    });
}
</script>
</body>
</html>
