{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Event Calendar</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <link rel="stylesheet" href="{% static 'css/mobile.css' %}">
    <!-- FullCalendar CSS -->
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">

    <style>
#calendar {
    margin-top: 20px;
    background: white;
    padding: 15px;
    border-radius: 12px;
}

.calendar-controls {
    margin-bottom: 20px;
}

.calendar-controls button {
    padding: 8px 14px;
    margin-right: 10px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    background-color: #1976d2;
    color: white;
}

.calendar-controls button.active {
    background-color: #0d47a1;
}

.legend {
    margin-bottom: 15px;
}

.legend span {
    margin-right: 15px;
    font-weight: 500;
}

.legend i {
    display: inline-block;
    width: 12px;
    height: 12px;
    border-radius: 3px;
    margin-right: 5px;
}

        /* Notification Bell */
        .notif-wrap { position:relative; display:inline-flex; align-items:center; }
        .notif-bell { background:none; border:none; cursor:pointer; font-size:1.2rem; padding:6px; border-radius:50%; transition:background .2s; position:relative; }
        .notif-bell:hover { background:rgba(99,102,241,.1); }
        .notif-badge { position:absolute; top:2px; right:2px; background:#ef4444; color:#fff; border-radius:50%; width:16px; height:16px; font-size:.6rem; font-weight:700; display:none; align-items:center; justify-content:center; }
        .notif-badge.show { display:flex; }
        .notif-dropdown { position:absolute; right:0; top:calc(100% + 8px); width:320px; background:#fff; border:1px solid #e5e7eb; border-radius:12px; box-shadow:0 8px 24px rgba(0,0,0,.12); z-index:999; display:none; max-height:380px; overflow-y:auto; }
        .notif-dropdown.open { display:block; }
        .notif-header { padding:12px 16px; border-bottom:1px solid #f3f4f6; display:flex; justify-content:space-between; align-items:center; }
        .notif-header span { font-weight:700; font-size:.9rem; color:#1e1b4b; }
        .notif-header button { background:none; border:none; color:#6366f1; font-size:.75rem; cursor:pointer; font-weight:600; }
        .notif-item { padding:10px 16px; border-bottom:1px solid #f9fafb; font-size:.82rem; color:#374151; cursor:pointer; transition:background .15s; }
        .notif-item:hover { background:#f9fafb; }
        .notif-item.unread { background:#eff6ff; font-weight:600; }
        .notif-item .notif-time { font-size:.72rem; color:#9ca3af; margin-top:2px; }
        .notif-empty { padding:24px 16px; text-align:center; color:#9ca3af; font-size:.85rem; }

    </style>
</head>

<body>

    <div id="page-loader"></div>
    
<header>
    <h3>Centralized Club Portal</h3>
    <nav>
        <a href="/home">Home</a>
        <a href="/clubs">Clubs</a>
        <a href="/events">Events</a>
        <a href="/calendar" class="active">Calendar</a>
                <div class="notif-wrap" id="notifWrap">
            <button class="notif-bell" onclick="toggleNotifDropdown(event)" title="Notifications">
                🔔
                <span class="notif-badge" id="notifBadge"></span>
            </button>
            <div class="notif-dropdown" id="notifDropdown">
                <div class="notif-header">
                    <span>Notifications</span>
                    <button onclick="markAllNotifsRead()">Mark all read</button>
                </div>
                <div id="notifList"><div class="notif-empty">No notifications</div></div>
            </div>
        </div>
        <div class="profile-btn-wrap" id="profileBtnWrap"></div>
    </nav>
</header>

<div class="container">

    <h2>Event Calendar</h2>

    <div class="calendar-controls">
        <button id="allBtn" onclick="loadAllEvents()">All Events</button>
        <button id="myBtn" onclick="loadMyEvents()">My Registered Events</button>
    </div>

    <div class="legend">

    <span><i style="background:#1976d2"></i>Workshop</span>

    <span><i style="background:#43a047"></i>Social</span>

    <span><i style="background:#8e24aa"></i>Seminar</span>

    <span><i style="background:#e53935"></i>Competition</span>

</div>

<div id="calendar"></div>

</div>

<!-- FullCalendar JS -->
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
<script src="{% static 'js/script.js' %}"></script>

<script>
let calendar;

document.addEventListener("DOMContentLoaded", function () {
    initProfileDropdown();

    const calendarEl = document.getElementById("calendar");

    calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: "dayGridMonth",
        height: 700,

        headerToolbar: {
            left: "prev,next today",
            center: "title",
            right: "dayGridMonth,timeGridWeek,timeGridDay"
        },

        eventClick: function(info) {

    const eventId = info.event.id;

    window.location.href = "/event/" + eventId;

},

      eventDidMount: function(info) {

    const e = info.event.extendedProps;

    const tooltip =
        info.event.title +
        "\nClub: " + (e.club || "N/A") +
        "\nLocation: " + (e.location || "N/A") +
        "\nTime: " + (e.time || "N/A") +
        "\nSeats: " + (e.registered || 0) + "/" + (e.capacity || 0);

    info.el.setAttribute("title", tooltip);

}
    });

    calendar.render();
    loadAllEvents();
});

function getEventColor(type) {

    if (!type) return "#1976d2";

    type = type.toLowerCase();

    if (type === "workshop") return "#1976d2";
    if (type === "social") return "#43a047";
    if (type === "seminar") return "#8e24aa";
    if (type === "competition") return "#e53935";

    return "#546e7a";
}

function loadAllEvents() {

    setActiveButton("allBtn");

    apiFetch("/api/events")
    .then(res => res.json())
    .then(data => {

        calendar.removeAllEvents();

        data.forEach(e => {

            const formattedDate =
                new Date(e.date).toISOString().split("T")[0];

            let titleText = e.title;

            if (e.is_full) {
                titleText = e.title + " (FULL)";
            }
            else if (e.seats_left !== undefined) {
                titleText = e.title + " (" + e.seats_left + " seats left)";
            }

            calendar.addEvent({

                id: e.id,
                title: titleText,
                start: formattedDate,

                backgroundColor: getEventColor(e.type),
                borderColor: getEventColor(e.type),

                extendedProps: {
                    club: e.club_name,
                    location: e.location,
                    time: e.time,
                    registered: e.registered_count,
                    capacity: e.capacity,
                    type: e.type
                }

            });

        });

    });

}


function loadMyEvents() {

    setActiveButton("myBtn");

    apiFetch("/api/my-registrations")
    .then(res => res.json())
    .then(data => {

        calendar.removeAllEvents();

        data.forEach(e => {

    const formattedDate =
        new Date(e.date).toISOString().split("T")[0];

    let titleText = e.title;

    if (e.is_full) {
        titleText += " (FULL)";
    } 
    else if (e.seats_left !== undefined) {
        titleText += " (" + e.seats_left + " seats left)";
    }

    calendar.addEvent({

        id: e.id,
        title: titleText,
        start: formattedDate,

        backgroundColor: getEventColor(e.type),
        borderColor: getEventColor(e.type),

        extendedProps: {
            club: e.club_name,
            location: e.location,
            time: e.time,
            registered: e.registered_count,
            capacity: e.capacity,
            type: e.type
        }

    });

});
    });

}


function setActiveButton(id) {
    document.getElementById("allBtn").classList.remove("active");
    document.getElementById("myBtn").classList.remove("active");
    document.getElementById(id).classList.add("active");
}
</script>


<script>
// ── Notification Bell ──
function loadNotifications() {
    apiFetch("/api/notifications").then(r => {
        if (!r.ok) return null;
        return r.json();
    }).then(data => {
        if (!data) return;
        const badge = document.getElementById("notifBadge");
        const list  = document.getElementById("notifList");
        if (!badge || !list) return;
        const unread = data.filter(n => !n.is_read);
        if (unread.length > 0) {
            badge.textContent = unread.length > 9 ? "9+" : unread.length;
            badge.classList.add("show");
        } else {
            badge.classList.remove("show");
        }
        if (data.length === 0) {
            list.innerHTML = '<div class="notif-empty">No notifications yet</div>';
            return;
        }
        list.innerHTML = data.map(n =>
            '<div class="notif-item ' + (n.is_read ? "" : "unread") + '" onclick="markNotifRead(' + n.id + ', this)">' +
            '<div>' + n.message + '</div>' +
            '<div class="notif-time">' + new Date(n.created_at).toLocaleString() + '</div>' +
            '</div>'
        ).join("");
    }).catch(() => {});
}

function toggleNotifDropdown(e) {
    e.stopPropagation();
    document.getElementById("notifDropdown").classList.toggle("open");
    loadNotifications();
}

function markNotifRead(id, el) {
    apiFetch("/api/notifications/" + id + "/read", { method: "PUT" }).then(() => {
        el.classList.remove("unread");
        loadNotifications();
    }).catch(() => {});
}

function markAllNotifsRead() {
    apiFetch("/api/notifications/read-all", { method: "PUT" }).then(() => {
        loadNotifications();
        document.getElementById("notifDropdown").classList.remove("open");
    }).catch(() => {});
}

document.addEventListener("click", function(e) {
    var wrap = document.getElementById("notifWrap");
    if (wrap && !wrap.contains(e.target)) {
        document.getElementById("notifDropdown").classList.remove("open");
    }
});

// Load notifications on page load and refresh every 60s
document.addEventListener("DOMContentLoaded", function() {
    loadNotifications();
    setInterval(loadNotifications, 60000);
});
</script>

</body>
</html>
